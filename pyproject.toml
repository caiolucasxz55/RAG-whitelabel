[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kit-rag"
version = "0.1.0"
description = "Kit white-label de RAG com citações e extração estruturada de documentos, com provedores trocáveis por configuração."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "caiolucasxz55" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
local = ["sentence-transformers>=3.0"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.3", "numpy>=1.26"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
cli = ["typer>=0.12"]
all = ["kit-rag[anthropic,local,pgvector,api,cli]"]
dev = [
    "kit-rag[anthropic,pgvector,api,cli]",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
kit = "kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em pt-BR usam acentos e travessões

[tool.ruff.lint.per-file-ignores]
"src/kit/cli.py" = ["B008"]  # padrão do Typer: typer.Option(...) como default
"src/kit/api/app.py" = ["B008"]  # padrão do FastAPI: File(...)/Form(...) como default

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: precisa de serviços externos (Postgres/pgvector via KIT_TEST_DATABASE_URL)",
]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/kit"]
